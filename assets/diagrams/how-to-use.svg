<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1330" width="1440" height="1330" role="img" aria-labelledby="how-to-use-title how-to-use-desc" data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="1" data-visual-theme="Flat Icon" data-diagram-type="flowchart" data-semantic-profile="generic" data-semantic-valid="true" data-quality-profile="showcase">
<title id="how-to-use-title">Install once, execute the relevant stages</title>
<desc id="how-to-use-desc">Usage flow installs both upstream skill collections, checks the nineteen required workflow capabilities, reuses repository setup and runs only the requested stages.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<defs><marker id="how-to-use-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M 0,0 L 12,5 L 0,10 Z" fill="#2563eb"/></marker></defs>
<rect data-graph-role="background" x="0" y="0" width="1440" height="1330" fill="#ffffff"/>
<text x="48" y="58" font-size="38" font-weight="600" fill="#111827">Install once, execute the relevant stages</text>
<text x="48" y="100" font-size="25" font-weight="400" fill="#6b7280">Install the full upstream collections; execute only the relevant stages.</text>
<g id="usage-1" data-graph-role="node" data-node-id="usage-1" data-semantic-role="process" data-graph-bounds="48,160,1392,320">
<rect x="48" y="160" width="1344" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="202" font-size="30" font-weight="600" fill="#111827">Install both upstream skill collections</text>
<text x="76" y="247" font-size="25" font-weight="500" fill="#2563eb">Matt Pocock Skills + MKL UML Skills</text>
<text x="76" y="286" font-size="24" font-weight="400" fill="#6b7280">Select all skills; choose the target agent.</text>
</g>
<path id="usage-1-2" data-graph-role="edge" data-edge-id="usage-1-2" data-source="usage-1" data-target="usage-2" data-edge-kind="flow" data-flow="handoff" d="M 720,320 L 720,375" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#how-to-use-arrow)"/>
<g id="usage-2" data-graph-role="node" data-node-id="usage-2" data-semantic-role="process" data-graph-bounds="48,375,1392,535">
<rect x="48" y="375" width="1344" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="417" font-size="30" font-weight="600" fill="#111827">Verify the 19 required workflow capabilities</text>
<text x="76" y="462" font-size="25" font-weight="500" fill="#2563eb">Default full-workflow checks the named minimum set.</text>
<text x="76" y="501" font-size="24" font-weight="400" fill="#6b7280">Presence, activation, setup and rendering are separate checks.</text>
</g>
<path id="usage-2-3" data-graph-role="edge" data-edge-id="usage-2-3" data-source="usage-2" data-target="usage-3" data-edge-kind="flow" data-flow="handoff" d="M 720,535 L 720,590" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#how-to-use-arrow)"/>
<g id="usage-3" data-graph-role="node" data-node-id="usage-3" data-semantic-role="process" data-graph-bounds="48,590,1392,750">
<rect x="48" y="590" width="1344" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="632" font-size="30" font-weight="600" fill="#111827">Reuse or configure the target repository</text>
<text x="76" y="677" font-size="25" font-weight="500" fill="#2563eb">Read actual tracker, terminology and status conventions.</text>
<text x="76" y="716" font-size="24" font-weight="400" fill="#6b7280">Use setup-matt-pocock-skills and the named adapter where needed.</text>
</g>
<path id="usage-3-4" data-graph-role="edge" data-edge-id="usage-3-4" data-source="usage-3" data-target="usage-4" data-edge-kind="flow" data-flow="handoff" d="M 720,750 L 720,805" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#how-to-use-arrow)"/>
<g id="usage-4" data-graph-role="node" data-node-id="usage-4" data-semantic-role="process" data-graph-bounds="48,805,1392,965">
<rect x="48" y="805" width="1344" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="847" font-size="30" font-weight="600" fill="#111827">Execute the stages the request needs</text>
<text x="76" y="892" font-size="25" font-weight="500" fill="#2563eb">Full development, design only, review only or a resumed scope.</text>
<text x="76" y="931" font-size="24" font-weight="400" fill="#6b7280">Consume actual prior results; stop dependent work on missing input.</text>
</g>
<path id="usage-4-5" data-graph-role="edge" data-edge-id="usage-4-5" data-source="usage-4" data-target="usage-5" data-edge-kind="flow" data-flow="handoff" d="M 720,965 L 720,1020" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#how-to-use-arrow)"/>
<g id="usage-5" data-graph-role="node" data-node-id="usage-5" data-semantic-role="process" data-graph-bounds="48,1020,1392,1180">
<rect x="48" y="1020" width="1344" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="1062" font-size="30" font-weight="600" fill="#111827">Inspect the delivered evidence</text>
<text x="76" y="1107" font-size="25" font-weight="500" fill="#2563eb">Current outputs, executed checks, findings and corrections.</text>
<text x="76" y="1146" font-size="24" font-weight="400" fill="#6b7280">Architecture changes return through implementation and review.</text>
</g>
<text x="48" y="1242" font-size="24" font-weight="400" fill="#6b7280">Legacy core (12) and detailed-design (14) profiles remain diagnostics only.</text>
<text x="48" y="1284" font-size="24" font-weight="500" fill="#111827">They do not satisfy the required 19-capability workflow minimum.</text>
</svg>
