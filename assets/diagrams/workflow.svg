<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2580" width="1440" height="2580" role="img" aria-labelledby="workflow-title workflow-desc" data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="1" data-visual-theme="Flat Icon" data-diagram-type="flowchart" data-semantic-profile="generic" data-semantic-valid="true" data-quality-profile="showcase">
<title id="workflow-title">Eight stages from requirements to maintainable code</title>
<desc id="workflow-desc">C4 architecture connects analysis to detailed design; every stage produces the next input.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<defs><marker id="workflow-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M 0,0 L 12,5 L 0,10 Z" fill="#2563eb"/></marker></defs>
<rect data-graph-role="background" x="0" y="0" width="1440" height="2580" fill="#ffffff"/>
<text x="48" y="58" font-size="38" font-weight="600" fill="#111827">Eight stages from requirements to maintainable code</text>
<text x="48" y="100" font-size="25" font-weight="400" fill="#6b7280">Real inputs. Usable outputs. Reviewed transitions.</text>
<rect x="48" y="132" width="1344" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="72" y="166" font-size="20" font-weight="600" fill="#2563eb">PREPARATION</text>
<text x="300" y="166" font-size="24" font-weight="400" fill="#111827">Install both full collections; verify the 20-skill workflow minimum.</text>
<text x="300" y="198" font-size="22" font-weight="400" fill="#6b7280">Reuse valid setup; select stages and depth for the actual request.</text>
<g id="stage-1" data-graph-role="node" data-node-id="stage-1" data-semantic-role="process" data-graph-bounds="48,270,1392,490">
<rect x="48" y="270" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="312" font-size="30" font-weight="600" fill="#111827">1. Requirements clarification</text>
<text x="76" y="352" font-size="24" font-weight="400" fill="#6b7280">Read sources; ask consequential functional and quality questions.</text>
<text x="76" y="392" font-size="22" font-weight="500" fill="#2563eb">grill-with-docs</text>
<text x="76" y="466" font-size="24" font-weight="500" fill="#111827">OUTPUT  Answers, sources, conflicts and open decisions.</text>
</g>
<path id="flow-1-2" data-graph-role="edge" data-edge-id="flow-1-2" data-source="stage-1" data-target="stage-2" data-edge-kind="flow" data-flow="handoff" d="M 720,490 L 720,540" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-2" data-graph-role="node" data-node-id="stage-2" data-semantic-role="process" data-graph-bounds="48,540,1392,760">
<rect x="48" y="540" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="582" font-size="30" font-weight="600" fill="#111827">2. Requirements baseline</text>
<text x="76" y="622" font-size="24" font-weight="400" fill="#6b7280">Consolidate behavior and derive independent expected outcomes.</text>
<text x="76" y="662" font-size="22" font-weight="500" fill="#2563eb">This skill coordinates; mkl-use-case-specifier</text>
<text x="76" y="694" font-size="22" font-weight="500" fill="#2563eb">mkl-uml-use-case-diagram (when useful)</text>
<text x="76" y="736" font-size="24" font-weight="500" fill="#111827">OUTPUT  Scope, rules, use cases, qualities and acceptance.</text>
</g>
<path id="flow-2-3" data-graph-role="edge" data-edge-id="flow-2-3" data-source="stage-2" data-target="stage-3" data-edge-kind="flow" data-flow="handoff" d="M 720,760 L 720,810" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-3" data-graph-role="node" data-node-id="stage-3" data-semantic-role="process" data-graph-bounds="48,810,1392,1030">
<rect x="48" y="810" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="852" font-size="30" font-weight="600" fill="#111827">3. Analysis</text>
<text x="76" y="892" font-size="24" font-weight="400" fill="#6b7280">Identify concepts and boundary / control / entity responsibilities.</text>
<text x="76" y="932" font-size="22" font-weight="500" fill="#2563eb">mkl-uml-domain-modeler; mkl-uml-robustness-diagram</text>
<text x="76" y="964" font-size="22" font-weight="500" fill="#2563eb">domain-modeling (as needed); mkl-pdr-review</text>
<text x="76" y="1006" font-size="24" font-weight="500" fill="#111827">OUTPUT  Vocabulary, concepts, BCE coverage and analysis findings.</text>
</g>
<path id="flow-3-4" data-graph-role="edge" data-edge-id="flow-3-4" data-source="stage-3" data-target="stage-4" data-edge-kind="flow" data-flow="handoff" d="M 720,1030 L 720,1080" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-4" data-graph-role="node" data-node-id="stage-4" data-semantic-role="process" data-graph-bounds="48,1080,1392,1300">
<rect x="48" y="1080" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="1122" font-size="30" font-weight="600" fill="#111827">4. High-level architecture</text>
<text x="76" y="1162" font-size="24" font-weight="400" fill="#6b7280">Choose boundaries, data ownership and quality strategies.</text>
<text x="76" y="1202" font-size="22" font-weight="500" fill="#2563eb">mkl-uml-c4-architecture</text>
<text x="76" y="1276" font-size="24" font-weight="500" fill="#111827">OUTPUT  Scoped C4 views, quality assessment and design constraints.</text>
</g>
<path id="flow-4-5" data-graph-role="edge" data-edge-id="flow-4-5" data-source="stage-4" data-target="stage-5" data-edge-kind="flow" data-flow="handoff" d="M 720,1300 L 720,1350" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-5" data-graph-role="node" data-node-id="stage-5" data-semantic-role="process" data-graph-bounds="48,1350,1392,1570">
<rect x="48" y="1350" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="1392" font-size="30" font-weight="600" fill="#111827">5. Detailed design</text>
<text x="76" y="1432" font-size="24" font-weight="400" fill="#6b7280">Refine architecture into owned operations and collaborations.</text>
<text x="76" y="1472" font-size="22" font-weight="500" fill="#2563eb">codebase-design; mkl-uml-sequence-diagram; mkl-uml-design-class-model</text>
<text x="76" y="1504" font-size="22" font-weight="500" fill="#2563eb">mkl-cdr-review, then to-spec and to-tickets</text>
<text x="76" y="1546" font-size="24" font-weight="500" fill="#111827">OUTPUT  Reviewed views, contracts, specification and slices.</text>
</g>
<path id="flow-5-6" data-graph-role="edge" data-edge-id="flow-5-6" data-source="stage-5" data-target="stage-6" data-edge-kind="flow" data-flow="handoff" d="M 720,1570 L 720,1620" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-6" data-graph-role="node" data-node-id="stage-6" data-semantic-role="process" data-graph-bounds="48,1620,1392,1840">
<rect x="48" y="1620" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="1662" font-size="30" font-weight="600" fill="#111827">6. Coding</text>
<text x="76" y="1702" font-size="24" font-weight="400" fill="#6b7280">Implement vertical slices; check behavior and refactor.</text>
<text x="76" y="1742" font-size="22" font-weight="500" fill="#2563eb">implement; tdd; named local adapter when needed</text>
<text x="76" y="1816" font-size="24" font-weight="500" fill="#111827">OUTPUT  Code, actual checks, refactoring and current design.</text>
</g>
<path id="flow-6-7" data-graph-role="edge" data-edge-id="flow-6-7" data-source="stage-6" data-target="stage-7" data-edge-kind="flow" data-flow="handoff" d="M 720,1840 L 720,1890" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-7" data-graph-role="node" data-node-id="stage-7" data-semantic-role="process" data-graph-bounds="48,1890,1392,2110">
<rect x="48" y="1890" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="1932" font-size="30" font-weight="600" fill="#111827">7. Code review</text>
<text x="76" y="1972" font-size="24" font-weight="400" fill="#6b7280">Review one fixed snapshot for requirements and standards.</text>
<text x="76" y="2012" font-size="22" font-weight="500" fill="#2563eb">code-review; fixed-snapshot adapter for pending files</text>
<text x="76" y="2086" font-size="24" font-weight="500" fill="#111827">OUTPUT  Findings, verified corrections and reviewed snapshot.</text>
</g>
<path id="flow-7-8" data-graph-role="edge" data-edge-id="flow-7-8" data-source="stage-7" data-target="stage-8" data-edge-kind="flow" data-flow="handoff" d="M 720,2110 L 720,2160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#workflow-arrow)"/>
<g id="stage-8" data-graph-role="node" data-node-id="stage-8" data-semantic-role="process" data-graph-bounds="48,2160,1392,2380">
<rect x="48" y="2160" width="1344" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="76" y="2202" font-size="30" font-weight="600" fill="#111827">8. Architecture review</text>
<text x="76" y="2242" font-size="24" font-weight="400" fill="#6b7280">Compare implemented structure to architecture and quality goals.</text>
<text x="76" y="2282" font-size="22" font-weight="500" fill="#2563eb">improve-codebase-architecture</text>
<text x="76" y="2356" font-size="24" font-weight="500" fill="#111827">OUTPUT  Scoped retain/adjust decision, costs and reconsideration triggers.</text>
</g>
<text x="48" y="2460" font-size="24" font-weight="400" fill="#111827">Missing input returns to its producer; source changes invalidate affected results.</text>
<text x="48" y="2500" font-size="23" font-weight="400" fill="#6b7280">Architecture changes return through design, coding, checks and review.</text>
<text x="48" y="2542" font-size="23" font-weight="500" fill="#2563eb">FINAL DELIVERY  Current outcomes, evidence, trade-offs and limitations.</text>
</svg>
